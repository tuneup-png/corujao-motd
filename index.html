<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <title>Corujão CN - Matador</title>

    <style type="text/css">

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050705;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            text-align: center;
        }

        .box {
            width: 760px;
            height: 480px;
            margin: 20px auto 0 auto;
            background-color: #0b1008;
            border: 3px solid #8cff00;
        }

        .top {
            height: 55px;
            background-color: #111a0b;
            border-bottom: 2px solid #5d9900;
            text-align: center;
            vertical-align: middle;
        }

        .server {
            color: #b5ff45;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            padding-top: 12px;
        }

        .server2 {
            color: #777777;
            font-size: 10px;
            padding-top: 5px;
        }

        .main {
            height: 330px;
            text-align: center;
            vertical-align: middle;
        }

        .moon {
            color: #baff45;
            font-size: 70px;
            font-weight: bold;
            line-height: 70px;
        }

        .title {
            color: #9cff00;
            font-size: 43px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 3px 3px 0px #000000;
        }

        .title2 {
            color: #ffffff;
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 8px;
            margin-top: 12px;
            text-shadow: 2px 2px 0px #000000;
        }

        .line {
            width: 500px;
            height: 2px;
            background-color: #7dcc00;
            margin: 20px auto 18px auto;
        }

        .phrase {
            color: #bbbbbb;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .button {
            width: 300px;
            margin: 25px auto 0 auto;
            padding: 12px 5px;
            background-color: #84d600;
            border: 3px solid #000000;
            color: #071000;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .bottom {
            height: 90px;
            background-color: #080c06;
            border-top: 2px solid #355600;
            text-align: center;
            vertical-align: middle;
        }

        .bottom-title {
            color: #8cff00;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .bottom-text {
            color: #666666;
            font-size: 9px;
            margin-top: 8px;
        }

        .pixel {
            color: #8cff00;
            font-size: 16px;
        }

        .red {
            color: #ff3333;
        }

    </style>
</head>

<body>

<table class="box" cellpadding="0" cellspacing="0" border="0">

    <!-- CABEÇALHO -->
    <tr>
        <td class="top">

            <div class="server">
                ★ SERVIDOR COUNTER-STRIKE 1.6 ★
            </div>

            <div class="server2">
                CORUJÃO CN
            </div>

        </td>
    </tr>


    <!-- ÁREA PRINCIPAL -->
    <tr>
        <td class="main">

            <div class="moon">
                ☾
            </div>

            <div class="title">
                CORUJÃO CN
            </div>

            <div class="title2">
                - MATADOR -
            </div>

            <div class="line"></div>

            <div class="phrase">
                ENTRE • JOGUE • MATE • DOMINE
            </div>

            <div class="button">
                [ BEM-VINDO AO SERVIDOR ]
            </div>

        </td>
    </tr>


    <!-- RODAPÉ -->
    <tr>
        <td class="bottom">

            <div class="bottom-title">
                <span class="pixel">■</span>
                CORUJÃO CN - MATADOR
                <span class="pixel">■</span>
            </div>

            <div class="bottom-text">
                COUNTER-STRIKE 1.6 &nbsp; | &nbsp; ARCADE NIGHT
            </div>

            <div class="bottom-text">
                RESPEITE OS PLAYERS • BOM JOGO • GL HF
            </div>

        </td>
    </tr>

</table>

</body>
</html>
